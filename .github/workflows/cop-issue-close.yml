name: Close Cop Issue on Merge

permissions:
  issues: write
  pull-requests: read

on:
  pull_request:
    types: [closed]

jobs:
  close-issue:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Extract cop and issue from PR body
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Look for <!-- nitrocop-cop-issue: number=NNN cop=Dept/Name -->
          ISSUE=$(echo "$PR_BODY" | grep -oP 'nitrocop-cop-issue:.*?number=\K\d+' || echo "")
          COP=$(echo "$PR_BODY" | grep -oP 'nitrocop-cop-issue:.*?cop=\K[A-Za-z]+/[A-Za-z]+' || echo "")
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "cop=$COP" >> "$GITHUB_OUTPUT"
          if [ -z "$ISSUE" ]; then
            echo "No cop tracker issue linked — skipping"
          else
            echo "Found: cop=$COP issue=#$ISSUE"
          fi

      - name: Close tracker issue
        if: steps.extract.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE="${{ steps.extract.outputs.issue }}"
          COP="${{ steps.extract.outputs.cop }}"
          # Close the issue so batch-dispatch won't re-dispatch this cop
          # before the next oracle run. issues-sync will reopen it if
          # divergence remains after the oracle refreshes.
          gh issue close "$ISSUE" \
            --repo "${{ github.repository }}" \
            --comment "PR #${{ github.event.pull_request.number }} merged (\`${COP}\`). Closing until next oracle run verifies conformance."
          echo "Closed issue #$ISSUE"
