name: Disk Analyze (temp)

# Temporary diagnostic workflow to inventory disk usage on the ubuntu-24.04
# runner so we can right-size the free-disk-space action for collect-results.
# Safe to delete once the corpus-oracle disk pressure is resolved.

on:
  workflow_dispatch:
    inputs:
      run_free_disk_space:
        description: 'Also run the existing free-disk-space action and re-report'
        type: boolean
        default: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Baseline df
        run: |
          echo "=== df -h ==="
          df -h
          echo
          echo "=== df / ==="
          df -h /
          echo
          echo "=== inode usage ==="
          df -i /

      - name: Top-level / usage
        run: |
          echo "=== sudo du -hx -d1 / (skip mounts) ==="
          sudo du -hx -d1 / 2>/dev/null | sort -h | tail -40

      - name: Common heavy directories
        run: |
          for d in \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/share/miniconda \
            /usr/share/gradle-* \
            /usr/share/kotlinc \
            /usr/share/az_* \
            /opt/az \
            /opt/microsoft \
            /opt/hostedtoolcache \
            /opt/google \
            /opt/pipx \
            /usr/local/.ghcup \
            /usr/local/lib/node_modules \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/chrome \
            /usr/local/share/vcpkg \
            /var/lib/docker \
            /var/lib/snapd \
            /var/cache/apt \
            /home/linuxbrew \
            /home/runner/.cargo \
            /home/runner/.rustup \
            /home/runner/.dotnet \
            /home/runner/.nvm
          do
            if [ -e "$d" ]; then
              sudo du -sh "$d" 2>/dev/null || true
            fi
          done

      - name: Hosted toolcache breakdown
        run: |
          if [ -d /opt/hostedtoolcache ]; then
            echo "=== /opt/hostedtoolcache children ==="
            sudo du -sh /opt/hostedtoolcache/* 2>/dev/null | sort -h
          fi

      - name: Docker images
        run: |
          if command -v docker >/dev/null; then
            echo "=== docker images ==="
            docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' || true
            echo
            echo "=== docker system df ==="
            docker system df || true
          fi

      - name: Run existing free-disk-space action
        if: ${{ inputs.run_free_disk_space }}
        uses: ./.github/actions/free-disk-space
        with:
          verbose: 'true'

      - name: After cleanup df
        if: ${{ inputs.run_free_disk_space }}
        run: |
          echo "=== df -h after cleanup ==="
          df -h /
