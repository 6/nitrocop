name: Corpus Oracle

permissions:
  contents: write
  pull-requests: write
  actions: read  # collect-results needs this to download artifacts from a different run via source_run_id

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: false

on:
  # Manual trigger only — corpus oracle runs against thousands of repos
  workflow_dispatch:
    inputs:
      repo_filter:
        description: "Run only this repo ID (e.g. 'multi_json__multi_json__c5fa9fc'), or 'all'"
        default: "all"
      verbose_disk:
        description: "Log disk usage in free-disk-space and during batch processing"
        type: boolean
        default: false
      source_run_id:
        description: "Recovery: skip oracle-repo/run-synthetic and re-collect from this existing run's artifacts"
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build nitrocop release binary ──────────────────────────────
  build-nitrocop:
    if: ${{ inputs.source_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: nitrocop-binary
          path: target/release/nitrocop
          retention-days: 1

  # ── Compute matrix (batched, N repos per job) ──────────────────
  compute-matrix:
    if: ${{ inputs.source_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate matrix
        id: matrix
        run: |
          MATRIX=$(python3 bench/corpus/compute_batches.py matrix \
            --manifest bench/corpus/manifest.jsonl \
            --batch-size 30 \
            --repo-filter "$REPO_FILTER")
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
        env:
          REPO_FILTER: ${{ github.event.inputs.repo_filter || 'all' }}

  # ── Run oracle on each batch of repos ────────────────────────────
  oracle-repo:
    if: ${{ inputs.source_run_id == '' }}
    needs: [build-nitrocop, compute-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.compute-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: ./.github/actions/free-disk-space
        with:
          verbose: ${{ inputs.verbose_disk }}

      - name: Download nitrocop binary
        uses: actions/download-artifact@v8
        id: download-binary
        with:
          name: nitrocop-binary
          path: bin/
        continue-on-error: true

      - name: Retry binary download
        if: steps.download-binary.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: nitrocop-binary
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/nitrocop

      # Ruby version read from mise.toml
      - uses: ruby/setup-ruby@v1

      - name: Cache baseline bundle
        uses: actions/cache@v5
        with:
          path: bench/corpus/vendor/bundle
          key: corpus-bundle-${{ hashFiles('bench/corpus/Gemfile') }}

      - name: Install baseline gems
        run: |
          cd bench/corpus
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Generate variant batch configs
        run: python3 bench/corpus/gen_variant_batches.py --output-dir bench/corpus/variant_batches/

      - name: Export nitrocop cop list
        run: bin/nitrocop --list-cops > nitrocop-cops.txt

      - name: Compute rubocop cache keys
        id: rubocop-cache-key
        run: |
          # Rubocop results are deterministic for a given (repo SHA, rubocop
          # version, config, invocation). Hash every file whose content could
          # change what rubocop produces so the cache self-invalidates on any
          # meaningful change — no manual cache-bust comments needed.
          CACHE_INPUTS=(
            # Workflow itself — catches rubocop invocation flag changes,
            # overlay config path moves, and IG/main pipeline splits.
            .github/workflows/corpus-oracle.yml
            # Baseline config and gem pins.
            bench/corpus/Gemfile
            bench/corpus/Gemfile.lock
            bench/corpus/baseline_rubocop.yml
            # Per-repo overlay + derived IG cop list.
            bench/corpus/gen_repo_config.py
            bench/corpus/compute_ig_cops.py
            bench/corpus/repo_excludes.json
            bench/corpus/rescue_parser_crashes.rb
            bench/corpus/run_variant_batches.py
            # Vendored plugin configs — a plugin bump changes cop behavior
            # even if nothing in bench/corpus/ does.
            vendor/rubocop/config/default.yml
            vendor/rubocop-rails/config/default.yml
            vendor/rubocop-rake/config/default.yml
            vendor/rubocop-rspec/config/default.yml
            vendor/rubocop-rspec_rails/config/default.yml
            vendor/rubocop-performance/config/default.yml
            vendor/rubocop-factory_bot/config/default.yml
          )
          # Concatenate existing files in a stable order and hash the result.
          # Missing files are skipped (e.g., an unrelated plugin removal).
          EXISTING=()
          for f in "${CACHE_INPUTS[@]}"; do
            [ -f "$f" ] && EXISTING+=("$f")
          done
          KEY_HASH=$(cat "${EXISTING[@]}" | sha256sum | cut -c1-16)
          echo "hash=${KEY_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore cached rubocop results
        uses: actions/cache/restore@v5
        id: rubocop-cache
        with:
          path: rubocop-cache/
          # Restore the consolidated cache from the previous collect-results job.
          # This contains ALL repos' rubocop results, so batch composition changes
          # (including batch size changes) don't cause cold caches.
          # Falls back to any per-batch cache if no consolidated cache exists yet.
          key: rubocop-all-${{ steps.rubocop-cache-key.outputs.hash }}-dummy
          restore-keys: |
            rubocop-all-${{ steps.rubocop-cache-key.outputs.hash }}-
            rubocop-${{ steps.rubocop-cache-key.outputs.hash }}-

      - name: Restore cached variant rubocop results
        uses: actions/cache/restore@v5
        with:
          path: variant-rubocop-cache/
          key: variant-rubocop-all-${{ steps.rubocop-cache-key.outputs.hash }}-dummy
          restore-keys: |
            variant-rubocop-all-${{ steps.rubocop-cache-key.outputs.hash }}-

      - name: Compute batch repos
        id: batch-repos
        run: |
          LARGE_FLAG=""
          if [ "${{ matrix.is_large }}" = "true" ]; then
            LARGE_FLAG="--is-large"
          fi
          python3 bench/corpus/compute_batches.py repos \
            --manifest bench/corpus/manifest.jsonl \
            --batch-id "${{ matrix.batch_id }}" \
            --num-batches "${{ matrix.num_batches }}" \
            --repo-filter "${{ github.event.inputs.repo_filter || 'all' }}" \
            --output batch_repos.json \
            $LARGE_FLAG

      - name: Pre-clone repos (parallel)
        run: |
          # Uses shared clone script — identical to check-cop's clone path
          REPO_IDS=$(jq -r '.[].id' batch_repos.json | paste -sd,)
          python3 bench/corpus/clone_repos.py \
            --dest . \
            --manifest bench/corpus/manifest.jsonl \
            --repo-ids "$REPO_IDS" \
            --parallel 6

      - name: Run batch
        id: run-batch
        run: |
          mkdir -p results/nitrocop results/rubocop results/ig-nitrocop results/ig-rubocop results/ig-context rubocop-cache

          # Include-gated cops: cops with non-**/ Include patterns that get
          # zero data in the main comparison because both tools fail to resolve
          # cop-level Include patterns when config is outside repo dir.
          # Derived from the vendored plugin configs at workflow start so adding
          # a new plugin or cop picks up the right cops automatically.
          # See docs/investigation-target-dir-relativization.md.
          IG_COPS=$(python3 bench/corpus/compute_ig_cops.py)
          echo "IG_COPS=$IG_COPS"

          while IFS= read -r row; do
            REPO_ID=$(echo "$row" | jq -r '.id')
            REPO_URL=$(echo "$row" | jq -r '.repo_url')
            REPO_SHA=$(echo "$row" | jq -r '.sha')

            echo "::group::${REPO_ID}"

            # Skip repos that failed to clone
            if [ ! -d "repos/${REPO_ID}" ]; then
              echo "::warning::Skipping ${REPO_ID} (clone failed — repo may be deleted or private)"
              echo "::endgroup::"
              continue
            fi

            DEST="repos/${REPO_ID}"

            RUBOCOP_CACHED=false
            if [ -f "rubocop-cache/${REPO_ID}_${REPO_SHA}.json" ]; then
              echo "Using cached rubocop result for ${REPO_ID}"
              cp "rubocop-cache/${REPO_ID}_${REPO_SHA}.json" "results/rubocop/${REPO_ID}.json"
              RUBOCOP_CACHED=true
            fi

            # Per-repo timeout (25 min each tool).
            # Keeps one slow repo from killing the whole batch.
            REPO_TIMEOUT=1500  # 25 minutes

            # Resolve per-repo config (adds file exclusions for repos with known parser crashes)
            REPO_CONFIG=$(python3 bench/corpus/gen_repo_config.py "$REPO_ID" bench/corpus/baseline_rubocop.yml "$DEST")

            # The overlay config is a `.rubocop*`-named file inside the repo,
            # so both tools resolve base_dir = repo_dir (not CWD). This makes
            # cop-level Include/Exclude patterns like `db/**/*.rb` match correctly.
            # GIT_CEILING_DIRECTORIES prevents walking up to parent git trees.
            WORKSPACE="$PWD"
            ABS_DEST="$(cd "$DEST" && pwd)"

            # nitrocop — uses shared script for oracle-identical invocation
            echo "=== nitrocop: ${REPO_ID} ==="

            # Diagnostic: log binary version and config for first repo in shard
            if [ "${DIAG_DONE:-}" != "1" ]; then
              echo "--- oracle shard diagnostic ---"
              echo "binary: $WORKSPACE/bin/nitrocop"
              "$WORKSPACE/bin/nitrocop" --version 2>&1 || true
              echo "config: $REPO_CONFIG"
              head -8 "$REPO_CONFIG" 2>/dev/null || echo "(config not readable)"
              echo "repo: $ABS_DEST ($(find "$ABS_DEST" -name '*.rb' | wc -l) .rb files)"
              echo "--- end diagnostic ---"
              DIAG_DONE=1
            fi

            rc=0
            python3 bench/corpus/run_nitrocop.py "$ABS_DEST" \
              --binary "$WORKSPACE/bin/nitrocop" \
              --timeout "${REPO_TIMEOUT}" \
              --output "$WORKSPACE/results/nitrocop/${REPO_ID}.json" \
              2>"$WORKSPACE/results/nitrocop/${REPO_ID}.err" || rc=$?

            if [ "$rc" -eq 124 ]; then
              echo "::error::nitrocop TIMED OUT after ${REPO_TIMEOUT}s for ${REPO_ID} — this repo will show as 100% FN in corpus results"
            elif [ "$rc" -gt 1 ]; then
              # Exit code 1 = offenses found (normal). Only warn on actual failures.
              echo "::warning::nitrocop exited with code ${rc} for ${REPO_ID}"
              cat "$WORKSPACE/results/nitrocop/${REPO_ID}.err" 2>/dev/null || true
            fi

            # Diagnostic: log offense count for first repo
            if [ "${DIAG_NC_DONE:-}" != "1" ] && [ -f "$WORKSPACE/results/nitrocop/${REPO_ID}.json" ]; then
              NC_COUNT=$(python3 -c "import json; d=json.load(open('$WORKSPACE/results/nitrocop/${REPO_ID}.json')); print(len(d.get('offenses',[])))" 2>/dev/null || echo "?")
              echo "diag: nitrocop found $NC_COUNT offenses on ${REPO_ID}"
              if [ "$RUBOCOP_CACHED" = true ]; then
                RC_COUNT=$(python3 -c "import json; d=json.load(open('results/rubocop/${REPO_ID}.json')); print(sum(len(f.get('offenses',[])) for f in d.get('files',[])))" 2>/dev/null || echo "?")
                echo "diag: rubocop (cached) found $RC_COUNT offenses on ${REPO_ID}"
              fi
              DIAG_NC_DONE=1
            fi

            # rubocop — skip if we have a cached result
            if [ "$RUBOCOP_CACHED" = false ]; then
              echo "=== rubocop: ${REPO_ID} ==="
              rc=0
              timeout "${REPO_TIMEOUT}" \
              env BUNDLE_GEMFILE=$WORKSPACE/bench/corpus/Gemfile \
                  BUNDLE_PATH=$WORKSPACE/bench/corpus/vendor/bundle \
                  GIT_CEILING_DIRECTORIES=$(dirname "$ABS_DEST") \
              bundle exec rubocop \
                --require $WORKSPACE/bench/corpus/rescue_parser_crashes.rb \
                --config "$REPO_CONFIG" \
                --format json \
                --force-exclusion \
                --cache false \
                "$ABS_DEST" \
                > "$WORKSPACE/results/rubocop/${REPO_ID}.json" 2>"$WORKSPACE/results/rubocop/${REPO_ID}.err" || rc=$?

              if [ "$rc" -eq 124 ]; then
                echo "::error::rubocop TIMED OUT after ${REPO_TIMEOUT}s for ${REPO_ID} — this repo will show as 100% FN in corpus results"
              elif [ "$rc" -gt 1 ]; then
                # Exit code 1 = offenses found (normal for corpus repos).
                # Only warn on actual failures (OOM=137, crashes, etc.).
                echo "::warning::rubocop exited with code ${rc} for ${REPO_ID}"
                cat "$WORKSPACE/results/rubocop/${REPO_ID}.err" 2>/dev/null || true
              fi
            fi

            # Resolve symlink paths in JSON output before deleting the repo.
            # RuboCop follows symlinks and reports offenses on both the symlink
            # path (e.g., docs/gem/foo.gemspec) and the canonical path (gem/foo.gemspec).
            # This causes phantom FP/FN when the tools pick different paths for the
            # same physical file. Resolving to realpath while the repo is still on
            # disk ensures consistent paths in the diff.
            python3 bench/corpus/resolve_symlink_paths.py \
              "results/nitrocop/${REPO_ID}.json" \
              "results/rubocop/${REPO_ID}.json" \
              2>/dev/null || true

            # Extract source context around offenses before deleting the repo.
            # This embeds ~7 lines of source code around each offense location
            # into the corpus results, enabling investigation without cloning repos.
            python3 bench/corpus/extract_context.py \
              --nitrocop-json "results/nitrocop/${REPO_ID}.json" \
              --rubocop-json "results/rubocop/${REPO_ID}.json" \
              --repo-dir "$DEST" \
              --output "results/context/${REPO_ID}.json" \
              --context-lines 7 \
              2>/dev/null || true

            # Save rubocop result to cache dir (will be persisted after the batch).
            # Validate file paths are within the repo to prevent cache poisoning.
            if [ "$RUBOCOP_CACHED" = false ] && [ -f "results/rubocop/${REPO_ID}.json" ]; then
              if [ ! -s "results/rubocop/${REPO_ID}.json" ]; then
                echo "::warning::Rubocop result for ${REPO_ID} is empty (rubocop likely crashed) — not caching"
              elif python3 bench/corpus/validate_rubocop_result.py "results/rubocop/${REPO_ID}.json" "$ABS_DEST"; then
                cp "results/rubocop/${REPO_ID}.json" "rubocop-cache/${REPO_ID}_${REPO_SHA}.json"
              else
                echo "::warning::Rubocop result for ${REPO_ID} contains out-of-repo paths — not caching"
              fi
            fi

            # ── Include-gated comparison (cops with non-**/ Include patterns) ──
            # Both tools fail to resolve these cops' Include patterns when config
            # is outside repo dir. Writing .rubocop_include_check.yml IN the repo
            # makes base_dir = repo_dir for both tools.
            #
            # Inherit from $REPO_CONFIG (not baseline_rubocop.yml directly) so
            # the per-repo overlay's vendor excludes (vendor/**/*, _vendor/**/*,
            # .*/**/*, etc.) still apply. Without this, the IG pipeline inspects
            # vendored gem Rakefiles that the main pipeline excludes, and then
            # merge_include_gated.py overrides main results with vendored-path
            # offenses that no real user would ever see.
            IG_TIMEOUT=120

            cat > "$ABS_DEST/.rubocop_include_check.yml" << IGEOF
          inherit_from: $REPO_CONFIG
          IGEOF

            echo "=== ig-nitrocop: ${REPO_ID} ==="
            rc=0
            (cd "$ABS_DEST" && \
              timeout "${IG_TIMEOUT}" \
              env GIT_CEILING_DIRECTORIES=$(dirname "$ABS_DEST") \
              "$WORKSPACE/bin/nitrocop" \
                --preview \
                --config .rubocop_include_check.yml \
                --only "$IG_COPS" \
                --format json \
                --no-cache \
                "$ABS_DEST" \
                > "$WORKSPACE/results/ig-nitrocop/${REPO_ID}.json" \
                2>"$WORKSPACE/results/ig-nitrocop/${REPO_ID}.err") || rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "::warning::ig-nitrocop timed out after ${IG_TIMEOUT}s for ${REPO_ID}"
            fi

            echo "=== ig-rubocop: ${REPO_ID} ==="
            rc=0
            (cd "$ABS_DEST" && \
              timeout "${IG_TIMEOUT}" \
              env BUNDLE_GEMFILE=$WORKSPACE/bench/corpus/Gemfile \
                  BUNDLE_PATH=$WORKSPACE/bench/corpus/vendor/bundle \
                  GIT_CEILING_DIRECTORIES=$(dirname "$ABS_DEST") \
              bundle exec rubocop \
                --require $WORKSPACE/bench/corpus/rescue_parser_crashes.rb \
                --config .rubocop_include_check.yml \
                --only "$IG_COPS" \
                --format json \
                --force-exclusion \
                --cache false \
                "$ABS_DEST" \
                > "$WORKSPACE/results/ig-rubocop/${REPO_ID}.json" \
                2>"$WORKSPACE/results/ig-rubocop/${REPO_ID}.err") || rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "::warning::ig-rubocop timed out after ${IG_TIMEOUT}s for ${REPO_ID}"
            fi

            rm -f "$ABS_DEST/.rubocop_include_check.yml"

            # Extract source context for include-gated offenses (same as main pipeline).
            python3 bench/corpus/extract_context.py \
              --nitrocop-json "results/ig-nitrocop/${REPO_ID}.json" \
              --rubocop-json "results/ig-rubocop/${REPO_ID}.json" \
              --repo-dir "$DEST" \
              --output "results/ig-context/${REPO_ID}.json" \
              --context-lines 7 \
              2>/dev/null || true

            # ── Style-variant batch runs (all 3 batches, first 1000 repos) ──
            python3 bench/corpus/run_variant_batches.py \
              --repo-dir "$ABS_DEST" \
              --repo-id "$REPO_ID" \
              --binary "$WORKSPACE/bin/nitrocop" \
              --batches-dir "$WORKSPACE/bench/corpus/variant_batches" \
              --results-dir "$WORKSPACE/results" \
              --manifest "$WORKSPACE/bench/corpus/manifest.jsonl" \
              --max-variant-repos 1000 \
              --cache-dir "$WORKSPACE/variant-rubocop-cache" \
              --repo-sha "$REPO_SHA" \
              --timeout 900 || true

            # Extract source context for variant offenses (same as default
            # pipeline). This enables variant examples to include source
            # snippets for fixture prepopulation and agent investigation.
            for VC_BATCH_DIR in results/variant-nitrocop-variant_batch_*; do
              [ -d "$VC_BATCH_DIR" ] || continue
              VC_BATCH_NAME=$(basename "$VC_BATCH_DIR" | sed 's/variant-nitrocop-//')
              VC_RC_JSON="results/variant-rubocop-${VC_BATCH_NAME}/${REPO_ID}.json"
              VC_NC_JSON="${VC_BATCH_DIR}/${REPO_ID}.json"
              if [ -f "$VC_NC_JSON" ] || [ -f "$VC_RC_JSON" ]; then
                python3 bench/corpus/extract_context.py \
                  --nitrocop-json "$VC_NC_JSON" \
                  --rubocop-json "$VC_RC_JSON" \
                  --repo-dir "$DEST" \
                  --output "results/variant-context-${VC_BATCH_NAME}/${REPO_ID}.json" \
                  --context-lines 7 \
                  2>/dev/null || true
              fi
            done

            # Free disk space between repos
            rm -rf "$DEST"

            if [ "${{ inputs.verbose_disk }}" = "true" ]; then
              df -h / | tail -1
            fi

            echo "::endgroup::"
          done < <(jq -c '.[]' batch_repos.json)

      # Per-batch cache saving removed — the consolidated rubocop-all cache
      # in collect-results contains all repos and is restored via restore-keys
      # prefix match. Per-batch caches were 464MB × N batches, filling the
      # 10GB cache limit. The consolidated cache alone is sufficient.

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: corpus-results-${{ matrix.batch_id }}
          path: |
            results/
            nitrocop-cops.txt
          retention-days: 7
          include-hidden-files: false

      - name: Retry upload on failure
        if: failure() && steps.run-batch.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: corpus-results-${{ matrix.batch_id }}
          path: |
            results/
            nitrocop-cops.txt
          retention-days: 7
          include-hidden-files: false

  # ── Run synthetic benchmark (parallel with corpus batches) ────
  run-synthetic:
    if: ${{ inputs.source_run_id == '' }}
    needs: [build-nitrocop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Download nitrocop binary
        uses: actions/download-artifact@v8
        with:
          name: nitrocop-binary
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/nitrocop

      - uses: ruby/setup-ruby@v1

      - name: Cache synthetic bundle
        uses: actions/cache@v5
        with:
          path: bench/synthetic/vendor/bundle
          key: synthetic-bundle-${{ hashFiles('bench/synthetic/Gemfile') }}

      - name: Install synthetic gems
        run: |
          cd bench/synthetic
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Run synthetic benchmark
        run: |
          # run_synthetic.py expects the binary at target/release/nitrocop
          mkdir -p target/release
          cp bin/nitrocop target/release/nitrocop
          python3 bench/synthetic/run_synthetic.py --verbose

      - name: Upload synthetic results
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-results
          path: bench/synthetic/synthetic-results.json
          retention-days: 7

  # ── Collect and diff all results ───────────────────────────────
  collect-results:
    needs: [oracle-repo, run-synthetic]
    # Run when the upstream jobs succeed OR when they were skipped because
    # source_run_id was supplied for a recovery re-collect.
    if: ${{ !cancelled() && (inputs.source_run_id != '' || (needs.oracle-repo.result == 'success' && needs.run-synthetic.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Effective run_id to download artifacts from (defaults to current run).
      ARTIFACTS_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/free-disk-space
        with:
          verbose: ${{ inputs.verbose_disk }}

      - name: Disk after free-disk-space
        if: always()
        run: df -h /

      - name: Download all results
        uses: actions/download-artifact@v8
        id: download-results
        with:
          pattern: corpus-results-*
          path: all-results/
          merge-multiple: true
          run-id: ${{ env.ARTIFACTS_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Disk after download
        if: always()
        run: df -h /

      - name: Retry download on failure
        if: steps.download-results.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          pattern: corpus-results-*
          path: all-results/
          merge-multiple: true
          run-id: ${{ env.ARTIFACTS_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Disk after retry download
        if: always()
        run: df -h /

      - name: Download synthetic results
        uses: actions/download-artifact@v8
        with:
          name: synthetic-results
          path: synthetic-dl/
          run-id: ${{ env.ARTIFACTS_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Place synthetic results
        run: cp synthetic-dl/synthetic-results.json bench/synthetic/synthetic-results.json

      - name: Consolidate rubocop cache
        run: |
          python3 bench/corpus/consolidate_cache.py baseline \
            --manifest bench/corpus/manifest.jsonl \
            --source all-results/results/rubocop \
            --dest rubocop-cache

      - name: Disk after consolidate baseline cache
        if: always()
        run: |
          df -h /
          du -sh rubocop-cache 2>/dev/null || true

      - name: Compute rubocop cache key
        id: rubocop-cache-key
        run: |
          # Same hash as oracle-repo jobs use — must stay in sync
          EXCLUDES_FILE="bench/corpus/repo_excludes.json"
          RESCUE_FILE="bench/corpus/rescue_parser_crashes.rb"
          VARIANT_SCRIPT="bench/corpus/run_variant_batches.py"
          EXTRA_HASH=""
          for f in "$EXCLUDES_FILE" "$RESCUE_FILE" "$VARIANT_SCRIPT"; do
            if [ -f "$f" ]; then
              EXTRA_HASH="${EXTRA_HASH}$(sha256sum "$f" | cut -c1-16)"
            fi
          done
          KEY_HASH=$(echo "${EXTRA_HASH}" | cat - bench/corpus/Gemfile bench/corpus/baseline_rubocop.yml | sha256sum | cut -c1-16)
          echo "hash=${KEY_HASH}" >> "$GITHUB_OUTPUT"

      - name: Save consolidated rubocop cache
        uses: actions/cache/save@v5
        continue-on-error: true  # non-fatal if disk is tight; tarring transiently doubles cache footprint
        with:
          path: rubocop-cache/
          # Keyed by config hash + run_id so each successful run creates a fresh
          # consolidated cache. Batch jobs restore via restore-keys prefix match,
          # so they always get the most recent full cache regardless of batch size.
          key: rubocop-all-${{ steps.rubocop-cache-key.outputs.hash }}-${{ github.run_id }}

      - name: Disk after save baseline cache
        if: always()
        run: df -h /

      - name: Consolidate variant rubocop cache
        run: |
          python3 bench/corpus/consolidate_cache.py variants \
            --manifest bench/corpus/manifest.jsonl \
            --source all-results/results \
            --dest variant-rubocop-cache

      - name: Disk after consolidate variant cache
        if: always()
        run: |
          df -h /
          du -sh variant-rubocop-cache 2>/dev/null || true

      - name: Save consolidated variant rubocop cache
        uses: actions/cache/save@v5
        continue-on-error: true  # non-fatal if disk is tight
        with:
          path: variant-rubocop-cache/
          key: variant-rubocop-all-${{ steps.rubocop-cache-key.outputs.hash }}-${{ github.run_id }}

      - name: Disk after save variant cache
        if: always()
        run: df -h /

      - name: Diff and generate report
        run: |
          # Cop list is uploaded alongside results from any repo job
          COP_LIST=$(find all-results -name nitrocop-cops.txt -print -quit)
          # Context dir may not exist if all repos failed context extraction
          CONTEXT_DIR=""
          if [ -d "all-results/results/context" ]; then
            CONTEXT_DIR="--context-dir all-results/results/context"
          fi
          python3 bench/corpus/diff_results.py \
            --nitrocop-dir all-results/results/nitrocop \
            --rubocop-dir all-results/results/rubocop \
            --manifest bench/corpus/manifest.jsonl \
            --output-json corpus-results.json \
            --output-md corpus-results.md \
            ${COP_LIST:+--cop-list "$COP_LIST"} \
            $CONTEXT_DIR

      - name: Diff include-gated results
        run: |
          IG_NC_DIR="all-results/results/ig-nitrocop"
          IG_RC_DIR="all-results/results/ig-rubocop"
          if [ -d "$IG_NC_DIR" ] && [ -d "$IG_RC_DIR" ]; then
            # Restrict the IG diff to the auto-derived ig cop list. Without this,
            # RuboCop's --only still emits Lint/Syntax for every parse error
            # (it's a special cop that always runs), which inflates the IG diff
            # with thousands of phantom FN unrelated to the cops we're comparing.
            IG_COP_LIST=$(mktemp)
            python3 bench/corpus/compute_ig_cops.py | tr ',' '\n' > "$IG_COP_LIST"
            IG_CONTEXT_DIR=""
            if [ -d "all-results/results/ig-context" ]; then
              IG_CONTEXT_DIR="--context-dir all-results/results/ig-context"
            fi
            python3 bench/corpus/diff_results.py \
              --nitrocop-dir "$IG_NC_DIR" \
              --rubocop-dir "$IG_RC_DIR" \
              --manifest bench/corpus/manifest.jsonl \
              --output-json include-gated-results.json \
              --output-md include-gated-results.md \
              --cop-list "$IG_COP_LIST" \
              $IG_CONTEXT_DIR
            rm -f "$IG_COP_LIST"
            echo "Include-gated diff complete"
            head -50 include-gated-results.md
          else
            echo "No include-gated results found"
          fi

      - name: Merge include-gated results
        run: |
          if [ -f include-gated-results.json ]; then
            python3 bench/corpus/merge_include_gated.py \
              --main corpus-results.json \
              --include-gated include-gated-results.json \
              --output corpus-results.json
          else
            echo "No include-gated results to merge"
          fi

      - name: Generate variant batch configs (for style labels)
        run: python3 bench/corpus/gen_variant_batches.py --output-dir bench/corpus/variant_batches/

      - name: Diff style-variant results
        run: |
          # Process variant batches in parallel (each is independent).
          # Write JSON only (no .md) — the final markdown is generated
          # by gen_corpus_md.py from the merged results.
          COP_LIST=$(find all-results -name nitrocop-cops.txt -print -quit)
          PIDS=()
          for NC_DIR in all-results/results/variant-nitrocop-variant_batch_*; do
            [ -d "$NC_DIR" ] || continue
            BATCH_NAME=$(basename "$NC_DIR" | sed 's/variant-nitrocop-//')
            RC_DIR="all-results/results/variant-rubocop-${BATCH_NAME}"
            if [ ! -d "$RC_DIR" ]; then
              echo "No rubocop results for $BATCH_NAME"
              continue
            fi
            # Include source context for variant examples (extracted per-repo
            # before deletion, same as the default pipeline).
            VC_CTX_DIR=""
            if [ -d "all-results/results/variant-context-${BATCH_NAME}" ]; then
              VC_CTX_DIR="--context-dir all-results/results/variant-context-${BATCH_NAME}"
            fi
            echo "Diffing style-variant batch: $BATCH_NAME"
            python3 bench/corpus/diff_results.py \
              --nitrocop-dir "$NC_DIR" \
              --rubocop-dir "$RC_DIR" \
              --manifest bench/corpus/manifest.jsonl \
              --output-json "style-variant-${BATCH_NAME}.json" \
              --output-md /dev/null \
              ${COP_LIST:+--cop-list "$COP_LIST"} \
              $VC_CTX_DIR &
            PIDS+=($!)
          done
          for pid in "${PIDS[@]}"; do
            wait "$pid" || true
          done

          # Merge all variant batch results into a single summary
          python3 -c "
          from pathlib import Path; import json
          from bench.corpus.run_variant_batches import merge_variant_results
          files = sorted(Path('.').glob('style-variant-variant_batch_*.json'))
          if not files:
              print('No style-variant results to merge')
          else:
              merged = merge_variant_results(files, batches_dir='bench/corpus/variant_batches')
              Path('style-variant-results.json').write_text(json.dumps(merged, indent=2))
              print(f'Merged {len(files)} variant batch results')
          "

      - name: Patch variant stats into corpus results
        run: |
          # Must run AFTER IG merge so variant department rates are computed
          # from the final (merged) default FP/FN. Without this ordering,
          # variant rates can appear higher than default rates.
          SYNTH_ARG=""
          if [ -f bench/synthetic/synthetic-results.json ]; then
            SYNTH_ARG="--synthetic bench/synthetic/synthetic-results.json"
          fi
          python3 bench/corpus/patch_variant_stats.py \
            --corpus corpus-results.json \
            --variants style-variant-results.json \
            $SYNTH_ARG

      - name: Regenerate report with variant data
        run: |
          # Lightweight: reads the already-computed corpus-results.json
          # (with IG merge + variant patches applied) and generates MD.
          # Avoids re-parsing 11K+ raw result files.
          VARIANT_ARG=""
          if [ -f style-variant-results.json ]; then
            VARIANT_ARG="--style-variant-results style-variant-results.json"
          fi
          python3 bench/corpus/gen_corpus_md.py \
            --input corpus-results.json \
            --output corpus-results.md \
            $VARIANT_ARG

      - name: Generate tiers.json
        run: |
          python3 bench/corpus/gen_tiers.py \
            --input corpus-results.json \
            --synthetic bench/synthetic/synthetic-results.json \
            --output tiers.json

      - name: Update README conformance
        run: |
          python3 bench/corpus/update_readme.py \
            --input corpus-results.json \
            --synthetic bench/synthetic/synthetic-results.json \
            --manifest bench/corpus/manifest.jsonl \
            --readme README.md

      - name: Print summary
        run: |
          cat corpus-results.md
          # Step summary has a 1024k limit; keep just the top tables
          head -c 128000 corpus-results.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Update corpus report
        run: cp corpus-results.md docs/corpus.md

      - name: Generate cop coverage report
        run: |
          SYNTH_ARG=""
          if [ -f bench/synthetic/synthetic-results.json ]; then
            SYNTH_ARG="--synthetic bench/synthetic/synthetic-results.json"
          fi
          python3 scripts/cop_coverage.py --input corpus-results.json $SYNTH_ARG > docs/cop_coverage.md

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: corpus-report
          path: |
            corpus-results.json
            corpus-results.md
            include-gated-results.json
            include-gated-results.md
            style-variant-results.json
            style-variant-*.md
            tiers.json
            bench/synthetic/synthetic-results.json
            docs/corpus.md
            docs/cop_coverage.md
          retention-days: 30

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Open PR if tiers, README, or corpus report changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          CHANGED=false

          if ! diff -q tiers.json src/resources/tiers.json >/dev/null 2>&1; then
            CHANGED=true
          fi
          if ! git diff --quiet README.md; then
            CHANGED=true
          fi
          if ! git diff --quiet docs/corpus.md; then
            CHANGED=true
          fi
          if ! git diff --quiet docs/cop_coverage.md 2>/dev/null || \
             ! git ls-files --error-unmatch docs/cop_coverage.md >/dev/null 2>&1; then
            CHANGED=true
          fi

          if [ "$CHANGED" = false ]; then
            echo "No changes to commit"
            exit 0
          fi

          BRANCH="corpus-oracle/update-$(date +%s)"
          python3 scripts/workflows/workflow_git.py configure \
            --repo "${{ github.repository }}" \
            --identity github-actions \
            --unset-extraheader
          git checkout -B "$BRANCH"

          if ! diff -q tiers.json src/resources/tiers.json >/dev/null 2>&1; then
            cp tiers.json src/resources/tiers.json
            git add src/resources/tiers.json
          fi
          git add -f README.md docs/corpus.md docs/cop_coverage.md

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PR_META=$(python3 scripts/workflows/render_corpus_oracle_pr.py \
            --repo-root . \
            --repo-filter "${{ github.event.inputs.repo_filter || 'all' }}" \
            --run-number "${{ github.run_number }}" \
            --run-url "$RUN_URL")
          COMMIT_MSG=$(printf '%s' "$PR_META" | jq -r '.commit_message')
          PR_TITLE=$(printf '%s' "$PR_META" | jq -r '.pr_title')
          PR_BODY_FILE=$(mktemp)
          printf '%s' "$PR_META" | jq -r '.pr_body' > "$PR_BODY_FILE"

          git commit -m "$COMMIT_MSG"
          git push origin "$BRANCH" --force
          python3 scripts/workflows/workflow_git.py promote \
            --repo "${{ github.repository }}" \
            --branch "$BRANCH" \
            --message "$COMMIT_MSG"

          gh pr create \
              --title "$PR_TITLE" \
              --body-file "$PR_BODY_FILE" \
              --head "$BRANCH" \
              --base main

  # ── Pre-compute diagnosis (parallel matrix) ─────────────────────
  # Runs AFTER collect-results so artifact upload and PR succeed even
  # if diagnosis is slow. Splits diverging cops across 4 shards.
  diagnose:
    needs: [collect-results, build-nitrocop]
    # Skipped during a source_run_id recovery — the binary artifact lives in the source run only.
    if: ${{ !cancelled() && needs.collect-results.result == 'success' && inputs.source_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk-space
        with:
          verbose: ${{ inputs.verbose_disk }}

      - name: Download corpus results
        uses: actions/download-artifact@v8
        with:
          name: corpus-report
          path: .

      - name: Download nitrocop binary
        uses: actions/download-artifact@v8
        with:
          name: nitrocop-binary
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/nitrocop

      - uses: ruby/setup-ruby@v1

      - name: Install corpus bundle
        run: |
          cd bench/corpus
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Diagnose shard ${{ matrix.shard }}
        run: |
          python3 bench/corpus/diagnose_corpus.py \
            --input corpus-results.json \
            --output diagnosis-shard-${{ matrix.shard }}.json \
            --binary bin/nitrocop \
            --shard ${{ matrix.shard }}/4

      - name: Upload shard result
        uses: actions/upload-artifact@v7
        with:
          name: diagnosis-shard-${{ matrix.shard }}
          path: diagnosis-shard-${{ matrix.shard }}.json
          retention-days: 1

  # ── Merge diagnosis shards into final artifact ──────────────────
  finalize-diagnosis:
    needs: [collect-results, diagnose]
    if: ${{ !cancelled() && needs.collect-results.result == 'success' && inputs.source_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Download corpus results
        uses: actions/download-artifact@v8
        with:
          name: corpus-report
          path: .

      - name: Download diagnosis shards
        uses: actions/download-artifact@v8
        with:
          pattern: diagnosis-shard-*
          path: shards/
          merge-multiple: true

      - name: Merge diagnosis into corpus results
        run: |
          python3 bench/corpus/diagnose_corpus.py merge \
            --input corpus-results.json \
            --output corpus-results.json \
            --shards 'shards/diagnosis-shard-*.json'

      - name: Re-upload report with diagnosis
        uses: actions/upload-artifact@v7
        with:
          name: corpus-report
          path: |
            corpus-results.json
            corpus-results.md
            include-gated-results.json
            include-gated-results.md
            style-variant-results.json
            style-variant-*.md
            tiers.json
            bench/synthetic/synthetic-results.json
            docs/corpus.md
            docs/cop_coverage.md
          retention-days: 30
          overwrite: true
