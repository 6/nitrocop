name: Free Disk Space
description: Remove pre-installed tools from GitHub-hosted runners to reclaim disk space

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        echo "=== Disk before cleanup ==="
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift \
          /usr/share/miniconda /usr/share/az_* /usr/share/gradle-* \
          /usr/share/kotlinc /opt/az /opt/microsoft
        echo "=== Disk after cleanup ==="
        df -h /
