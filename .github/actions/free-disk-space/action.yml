name: Free Disk Space
description: Remove pre-installed tools from GitHub-hosted runners to reclaim disk space

inputs:
  verbose:
    description: Show before/after disk usage
    default: 'false'

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        if [ "${{ inputs.verbose }}" = "true" ]; then
          echo "=== Before cleanup ==="
          df -h / | tail -1
        fi
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift \
          /usr/share/miniconda /usr/share/az_*
        if [ "${{ inputs.verbose }}" = "true" ]; then
          echo "=== After cleanup ==="
          df -h / | tail -1
        fi
