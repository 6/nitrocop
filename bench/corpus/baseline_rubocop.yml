# rubocop-performance (9 cops)
Performance/ArraySemiInfiniteRangeSlice:
  Enabled: true
Performance/BigDecimalWithNumericArgument:
  Enabled: true
Performance/BlockGivenWithExplicitBlock:
  Enabled: true
Performance/CaseWhenSplat:
  Enabled: true
Performance/Casecmp:
  Enabled: true
Performance/ChainArrayAllocation:
  Enabled: true
Performance/IoReadlines:
  Enabled: true
Performance/OpenStruct:
  Enabled: true
Performance/SelectMap:
  Enabled: true

# rubocop-rails (12 cops)
Rails/ActionFilter:
  Enabled: true
Rails/BulkChangeTable:
  # Corpus reruns load this external baseline config from bench/corpus/ while
  # scanning absolute repo paths under /tmp, so rubocop-rails' relative
  # Include: db/**/*.rb would skip every migration file.
  Include:
    - "**/db/**/*.rb"
Rails/DefaultScope:
  Enabled: true
Rails/Env:
  Enabled: true
Rails/EnvironmentVariableAccess:
  Enabled: true
Rails/OrderById:
  Enabled: true
Rails/PluckId:
  Enabled: true
Rails/RequireDependency:
  Enabled: true
Rails/ReversibleMigrationMethodDefinition:
  Enabled: true
Rails/SaveBang:
  Enabled: true
Rails/SchemaComment:
  Enabled: true
Rails/TableNameAssignment:
  Enabled: true
Rails/UnusedIgnoredColumns:
  Enabled: true

# rubocop-rspec (6 cops)
RSpec/AlignLeftLetBrace:
  Enabled: true
RSpec/AlignRightLetBrace:
  Enabled: true
RSpec/DescribedClassModuleWrapping:
  Enabled: true
RSpec/Dialect:
  Enabled: true
  PreferredMethods:
    context: describe
RSpec/MessageExpectation:
  Enabled: true
RSpec/Pending:
  Enabled: true
