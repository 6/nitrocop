# Baseline RuboCop config for corpus oracle runs.
# All defaults, all plugins enabled. Used in baseline mode where
# the repo's own .rubocop.yml is ignored.
#
# Cops that are Enabled: false in vendor defaults are explicitly enabled
# below so we test ALL implementations against the corpus.
# NewCops: enable covers Enabled: pending cops automatically.
#
# cache-bust: 2026-04-12-ig-cops-refresh
# Bump this comment to invalidate the rubocop result cache. Needed after
# changes to the set of cops that run in the main vs ig pipelines so stale
# cached baselines don't cause asymmetric FP/FN.

plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-factory_bot
  - rubocop-rake

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 4.0
  TargetRailsVersion: 7.0
  # Standard junk exclusions — same for both tools
  Exclude:
    # NOTE: vendor*/**/* patterns are in gen_repo_config.py (as absolute paths
    # in the overlay), not here. Relative patterns here resolve to bench/corpus/
    # (the config file's parent), not the repo dir.
    - "node_modules/**/*"
    - "tmp/**/*"
    - "coverage/**/*"
    - "dist/**/*"
    - "build/**/*"
    - ".git/**/*"
    - ".bundle/**/*"
    - ".bundles_cache/**/*"
    - "bin/**/*"
    # Non-standard vendor directories in corpus repos
    - "heroku/**/*"
    - "examples/vendored-puppet/**/*"

# ============================================================================
# Cops with Enabled: false in vendor defaults — explicitly enable for corpus.
# These are opt-in cops that won't fire under standard configs. Enabling them
# ensures nitrocop's implementations are tested against real-world code.
# ============================================================================

# rubocop core (54 cops)
Bundler/GemComment:
  Enabled: true
Bundler/GemVersion:
  Enabled: true
Gemspec/DependencyVersion:
