Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true
Style/DocumentationMethod:
  Enabled: true
Style/HashLookupMethod:
  Enabled: true
Style/ImplicitRuntimeError:
  Enabled: true
Style/InlineComment:
  Enabled: true
Style/InvertibleUnlessCondition:
  Enabled: true
Style/IpAddresses:
  Enabled: true
Style/MethodCallWithArgsParentheses:
  Enabled: true
Style/MethodCalledOnDoEndBlock:
  Enabled: true
Style/MissingElse:
  Enabled: true
Style/MultilineMethodSignature:
  Enabled: true
Style/OptionHash:
  Enabled: true
Style/RequireOrder:
  Enabled: true
Style/ReturnNil:
  Enabled: true
Style/Send:
  Enabled: true
Style/SingleLineBlockParams:
  Enabled: true
Style/StaticClass:
  Enabled: true
Style/StringHashKeys:
  Enabled: true
Style/StringMethods:
  Enabled: true
Style/TopLevelMethodDefinition:
